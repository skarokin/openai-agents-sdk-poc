[project]
name = "agentpoc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "types-PyYAML",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "services/agent",
    "services/cli",
    "packages/agent-common",
]

[tool.pytest.ini_options]
testpaths = ["services/agent/tests"]
pythonpath = [
    "services/agent/src",
    "packages/agent-common/src",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
    "services/agent/src",
    "services/cli/src",
    "packages/agent-common/src",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agent", "agent_cli", "agent_common"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = [
    "services/agent/src",
    "services/cli/src",
    "packages/agent-common/src",
]
mypy_path = [
    "services/agent/src",
    "services/cli/src",
    "packages/agent-common/src",
]
namespace_packages = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "agents.*",
    "mcp.*",
    "opentelemetry.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "skarokin", email = "sean.kim0327@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-common",
    "fastapi",
    "mcp",
    "opentelemetry-api",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-sdk",
    "pyyaml",
    "strands-agents>=1.54.0",
    "uvicorn[standard]",
]

[project.scripts]
agent = "agent.main:main"

[tool.uv.sources]
agent-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
